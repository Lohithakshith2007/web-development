<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GitHub Dev Finder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            padding: 50px 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        /* Search Box */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .search-box button {
            padding: 12px 20px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-box button:hover {
            background-color: #0369a1;
        }

        /* Card Layout */
        .user-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: none;
            /* Hidden until data is loaded */
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .user-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
        }

        .user-info h2 {
            font-size: 1.25rem;
        }

        .user-info p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .bio {
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            background-color: #0f172a;
            padding: 12px 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .stat-item span {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .stat-item strong {
            font-size: 1.1rem;
            color: #38bdf8;
        }

        .profile-link {
            display: block;
            text-align: center;
            background-color: #334155;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        /* Status Messages */
        .status-msg {
            text-align: center;
            color: #94a3b8;
            font-size: 1rem;
            margin-top: 20px;
        }

        .error-msg {
            color: #f87171;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>GitHub Dev Finder</h1>

        <!-- Search Form -->
        <form id="search-form" class="search-box">
            <input type="text" id="username-input" placeholder="Search GitHub username..." required />
            <button type="submit">Search</button>
        </form>

        <!-- Message Container (for loading / errors) -->
        <div id="status-msg" class="status-msg">Type a username above to search.</div>

        <!-- User Profile Card -->
        <div id="user-card" class="user-card">
            <div class="user-header">
                <img id="avatar" class="user-avatar" src="" alt="Avatar" />
                <div class="user-info">
                    <h2 id="name">Name</h2>
                    <p id="username">@username</p>
                </div>
            </div>

            <p id="bio" class="bio">User bio will appear here...</p>

            <div class="stats">
                <div class="stat-item">
                    <span>Repos</span>
                    <strong id="repos">0</strong>
                </div>
                <div class="stat-item">
                    <span>Followers</span>
                    <strong id="followers">0</strong>
                </div>
                <div class="stat-item">
                    <span>Following</span>
                    <strong id="following">0</strong>
                </div>
            </div>

            <a id="profile-link" class="profile-link" href="#" target="_blank">View GitHub Profile</a>
        </div>
    </div>

    <script>
        // 1. Select DOM Elements
        const searchForm = document.getElementById('search-form');
        const usernameInput = document.getElementById('username-input');
        const statusMsg = document.getElementById('status-msg');
        const userCard = document.getElementById('user-card');

        const avatar = document.getElementById('avatar');
        const nameEl = document.getElementById('name');
        const usernameEl = document.getElementById('username');
        const bio = document.getElementById('bio');
        const repos = document.getElementById('repos');
        const followers = document.getElementById('followers');
        const following = document.getElementById('following');
        const profileLink = document.getElementById('profile-link');

        // 2. Event Listener
        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = usernameInput.value.trim();
            if (!username) return;

            // Reset UI state before fetching
            userCard.style.display = 'none';
            statusMsg.textContent = 'Loading profile...';
            statusMsg.classList.remove('error-msg');

            try {
                const response = await fetch(`https://api.github.com/users/${username}`);

                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('User not found. Try another username.');
                    }
                    throw new Error('Failed to fetch user data.');
                }

                const data = await response.json();

                // Populate Card Data
                avatar.src = data.avatar_url;
                avatar.alt = `${data.login}'s avatar`;
                nameEl.textContent = data.name || data.login;
                usernameEl.textContent = `@${data.login}`;
                bio.textContent = data.bio || 'No bio available.';
                repos.textContent = data.public_repos;
                followers.textContent = data.followers;
                following.textContent = data.following;
                profileLink.href = data.html_url;

                // Show card and clear loading message
                statusMsg.textContent = '';
                userCard.style.display = 'block';

            } catch (error) {
                statusMsg.textContent = error.message;
                statusMsg.classList.add('error-msg');
            }
        });
    </script>

</body>

</html>
