<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Simple Modal with Blurred Backdrop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        /* Trigger Button */
        .open-btn {
            padding: 12px 20px;
            font-size: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Modal Backdrop (Overlays whole screen) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            /* Blurs the page behind it */
            display: flex;
            align-items: center;
            justify-content: center;

            /* Hidden by default */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* Class added by JS to show modal */
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* The White Modal Box */
        .modal-box {
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 320px;
            text-align: center;
        }

        .close-btn {
            margin-top: 15px;
            padding: 8px 16px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Main Page Content -->
    <h1>Welcome to the Page</h1>
    <p>Click the button below to open the modal dialog.</p>
    <button id="open-btn" class="open-btn">Open Modal</button>

    <!-- Modal Overlay Container -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <h2>Hello!</h2>
            <p>This is a modal popup with a blurred background.</p>
            <button id="close-btn" class="close-btn">Close Modal</button>
        </div>
    </div>

    <script>
        // YOUR TASK: Write JavaScript here to handle open & close behavior!
        const openBtn = document.getElementById('open-btn');
        const closeBtn = document.getElementById('close-btn');
        const modalDiv = document.getElementById('modal-overlay');

        openBtn.addEventListener('click', () => {
            modalDiv.classList.add('active')
        })

        closeBtn.addEventListener('click', () => {
            modalDiv.classList.remove('active')
        })

        modalDiv.addEventListener('click', (e) => {
            // Only close if the click happened directly on the overlay itself, not inside the box
            if (e.target === modalDiv) {
                modalDiv.classList.remove('active');
            }
        });


    </script>

</body>

</html>
