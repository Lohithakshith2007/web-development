<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Styling for the sidebar */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 250px;
  height: 100%;
  background-color: #111;
  padding-top: 60px;
  transition: transform 0.3s ease; /* Smooth slide effect */
  
  /* This hides the sidebar to the left */
  transform: translateX(-100%); 
}

/* Links inside the sidebar */
.sidebar a {
  padding: 8px 32px;
  text-decoration: none;
  font-size: 25px;
  color: #818181;
  display: block;
}

/* The magic class that reveals the sidebar */
.sidebar.active {
  transform: translateX(0);
}

/* Simple close button positioning */
#close-btn {
  position: absolute;
  top: 10px;
  right: 25px;
  font-size: 36px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
}
    </style>
</head>
<body>
    <button id="toggle-btn">☰ Open Sidebar</button>

<div id="sidebar" class="sidebar">
  <button id="close-btn">×</button>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</div>
<script>
    // Grab the elements
const sidebar = document.getElementById('sidebar');
const toggleBtn = document.getElementById('toggle-btn');
const closeBtn = document.getElementById('close-btn');

// Toggle the 'active' class when the menu button is clicked
toggleBtn.addEventListener('click', () => {
  sidebar.classList.add('active');
});

// Remove the 'active' class when the close button is clicked
closeBtn.addEventListener('click', () => {
  sidebar.classList.remove('active');
});

</script>
</body>
</html>
