<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 1. A normal JavaScript object
        const user = {
            name: "Alice",
            age: 25,
            isOnline: true,
            skills: ["HTML", "CSS", "JavaScript"]
        };

        // 2. JSON.stringify(): Converts JS Object -> JSON String
        // (Use this when sending data to a server or saving to localStorage)
        const jsonString = JSON.stringify(user);
        console.log("As a String:", jsonString);
        // Output is a text string: {"name":"Alice","age":25,"isOnline":true,"skills":["HTML","CSS","JavaScript"]}


        // 3. JSON.parse(): Converts JSON String -> JS Object
        // (Use this when receiving data from an API or reading from localStorage)
        const parsedObject = JSON.parse(jsonString);
        console.log("As an Object:", parsedObject.name);
        // Output: Alice (You can access properties normally again)
    </script>
</body>

</html>
