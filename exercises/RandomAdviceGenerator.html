<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Advice Generator</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        #advice-text {
            font-size: 1.2rem;
            font-style: italic;
            margin: 20px 0;
            min-height: 30px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <h1>💡 Daily Advice Generator</h1>
    <p id="advice-text">Click the button below to get advice!</p>
    <button id="get-btn">Get Advice</button>

    <script>

        const advtxt = document.getElementById('advice-text');
        const btn = document.getElementById('get-btn');


        async function fetchAdvice() {
            // 1. Show UI Loading state
            advtxt.innerText = "Fetching new advice...";

            // 2. Wrap your network logic in try / catch
            try {
                // 3. Use 'fetch API' to call: https://api.adviceslip.com/advice
                const response = await fetch('https://api.adviceslip.com/advice');

                // 4. API Handling: Check if response.ok is true
                if(!response.ok){
                    throw new error("something is wrong");
                }

                // 5. JSON Parsing: Convert response to JS object using 'await response.json()'
                const result=await response.json();

                // 6. Inspect the API response:
                // The API returns an object like: { slip: { id: 1, advice: "Remember that..." } }
                // 7. Render: Display data.slip.advice inside adviceText.innerText
                advtxt.innerText=result.slip.advice;

            } catch (error) {
                advtxt.innerText=`something is wrong ${error}`;
                console.log(error);
                
            }
        }

        btn.addEventListener('click',fetchAdvice);


    </script>

</body>

</html>
