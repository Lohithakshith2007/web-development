<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // A simple function that returns a Promise after 2 seconds
function fetchData() {
  return new Promise((resolve) => {
    setTimeout(() => {
      resolve("Data received! ");
    }, 2000);
  });
}

// An async function using await
async function showData() {
  console.log("Fetching...");
  
  // Pause execution here until fetchData resolves
  const result = await fetchData(); 
  
  console.log(result);
}

// Run the function
showData();
    </script>
</body>
</html>
