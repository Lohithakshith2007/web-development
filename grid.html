<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .grid-container{
      height: 500px;
      gap: 30px;
      padding: 5px;
      text-align: center;
      display: grid;
      grid-template-columns: repeat(4,1fr);
    }

    .grid-item{
      color: white;
      background-color: rgb(227, 32, 32);
      align-content: center;
      border-radius: 20px;
      transition: all 0.3s ease-in-out;
      font-size:x-large;
    }

    .item1{
      grid-column: 1/3;
    }
    .grid-item:hover{
      background-color: rebeccapurple;
    }

    .item3{
      grid-column: 4/5;
      grid-row: 1/3;
    }

    .item5{
      grid-column: 2/4;
    }
    .item6{
      grid-column: 1/3;
    }
    .item7{
      grid-column: 3/5;
    }
    .item8{
      grid-column: 3/5;
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="grid-item item1">item1</div>
    <div class="grid-item item2">item2</div>
    <div class="grid-item item3">item3</div>
    <div class="grid-item item4">item4</div>
    <div class="grid-item item5">item5</div>
    <div class="grid-item item6">item6</div>
    <div class="grid-item item7">item7</div>
    <!-- <div class="grid-item item8">item8</div> -->
  </div>
</body>
</html>
