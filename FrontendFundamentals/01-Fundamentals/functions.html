<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button>btn</button>
    <script>
        // types of functions

        // function declaration
        function normalFunction() {
            console.log("this is a normal function decalration");
        }
        normalFunction();

        // function expression
        const func_exp = function (name) {
            console.log("hello " + name);
        }
        func_exp("lohith");

        // arrow function 
        const add = (a, b) => a + b;
        console.log(add(2, 3));

        // immediately involed function (IIFE)
        // also pronounced "iify"
        (function () {
            console.log("this is an IIFE");
        })();

        // anonymous function
        setTimeout(function () {
            console.log("Time's up!");
        }, 1000);

        // constructer function
        function Person(name, age) {
            this.name = name;
            this.age = age;
        }

        const user = new Person("Alice", 25);
        console.log(user);

        // async function
        async function fetchData() {
            const response = await fetch('https://jsonplaceholder.typicode.com/todos');
            const data = await response.json();
            console.log(data); // Works perfectly!
            return data;
        }
        fetchData();

        // callback function 
        const button = document.getElementsByTagName('button')[0];
        button.addEventListener('click', () => {
            console.log('Button was clicked!');
        });

        // methods 
        const smartBulb = {
            // Properties (Data)
            brand: "Lumina",
            isOn: false,

            // Method (Behavior)
            toggle() {
                this.isOn = !this.isOn; // "this" refers to smartBulb
                console.log(`${this.brand} light is now ${this.isOn ? 'ON' : 'OFF'}.`);
            }
        };

        // To use it, we just tell the bulb to toggle itself!
        smartBulb.toggle(); // Output: Lumina light is now ON.
        smartBulb.toggle(); // Output: Lumina light is now OFF.

    </script>
</body>

</html>
