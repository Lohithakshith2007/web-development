<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Simple Semantic Blog</title>

    <style>

      .flex-container{
        /* height: auto; */
        margin-top: 200px;
        display: flex;
        /* flex-wrap: wrap; */
        justify-content: space-evenly;
        /* align-items:flex-start; */
        background-color: yellow;

      }

      .flex-item{
        width: 100px;
        background-color: darkgray;
        border: 2px solid black;
      }
      .flex-item button{
        margin:50px 5% 5px 5px;
        width: 95%;
        border-radius: 5px;
        background-color: rgba(34, 34, 157, 0.418);

      }

      button{
        transition:all 0.2s ease;
      }

      button:active{
        transform: scale(0.8);
      }

      .flex-item1{
        min-height: 60px;
      }
      .flex-item2{
        min-height: 80px;
      }
      .flex-item3{
        min-height: 100px;
      }
      .flex-item4{
        min-height: 120px;
      }

      .main-axis{
        color: red;
        width: 100%;
        border: 1px solid black;
        overflow:visible;
      }

    </style>
</head>
<body>
  <div class="flex-container">
    <div class="flex-item flex-item1">flex box item 1 
    </div>
    <div class="flex-item flex-item2">flex box item 2</div>
    <div class="flex-item flex-item3">flex box item 3</div>
    <div class="flex-item flex-item4">flex box item 4</div>

    <!-- <div class="main-axis"></div>
    <div class="cross-axis"></div> -->
  </div>

</body>
</html>
