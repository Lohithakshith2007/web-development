<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // Test Starter Code:
        function customFilter(array, callback) {

            const result=[];

            for(const item of array){
                if(callback(item)){
                    result.push(item);
                }
            }

            return result;
        }

        // 1. Test with numbers
        const numbers = [10, 15, 20, 25, 30];
        const greaterThan18 = customFilter(numbers, num => num > 18);
        console.log(greaterThan18);
        // Expected Output: [20, 25, 30]

        // 2. Test with strings
        const tech = ["CSS", "JavaScript", "HTML", "Django"];
        const longNames = customFilter(tech, name => name.length > 4);
        console.log(longNames);
        // Expected Output: ["JavaScript", "Django"]
    </script>
</body>

</html>
